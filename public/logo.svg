<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad1)" filter="url(#shadow)"/>

  <!-- Steering Wheel Ring -->
  <circle cx="256" cy="240" r="120" fill="none" stroke="#ffffff" stroke-width="22" opacity="0.95"/>
  <circle cx="256" cy="240" r="36" fill="#ffffff"/>
  <!-- Spokes -->
  <rect x="245" y="138" width="22" height="70" fill="#ffffff" rx="11"/>
  <rect x="138" y="253" width="80" height="22" fill="#ffffff" rx="11" transform="rotate(-28 178 264)"/>
  <rect x="294" y="253" width="80" height="22" fill="#ffffff" rx="11" transform="rotate(28 334 264)"/>

  <!-- Attendance Check Badge (bottom right) -->
  <circle cx="370" cy="380" r="72" fill="#0f172a" stroke="#f97316" stroke-width="12"/>
  <path d="M334 380 L360 406 L408 354" fill="none" stroke="#f97316" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
